name: CI

# Runs on every PR targeting main plus direct pushes to main. The two-trigger
# setup means both the normal PR flow and any hotfix/admin push get verified.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: typecheck / lint / build / audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 20 is the current LTS. Next 15's own floor is 18.18+; we run on
          # 18.20.x locally. 20 keeps CI on the ecosystem's front foot
          # without blocking dev on 18.
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        # Catches runtime contract violations tsc misses: Zod validation in
        # the event registry, generateStaticParams, middleware compilation.
        run: npm run build

      - name: Audit production deps (fail on high+ severity)
        # Locks in the "0 high-severity advisories" bar for everything that
        # ships: if a new CVE lands in a production dependency (direct or
        # transitive), this step fails and the PR is blocked until someone
        # responds.
        #
        # Dev-only tooling (ESLint, Tailwind's build-time file watcher) is
        # left out with --omit=dev: it never reaches the deployed app, and
        # advisories there can have no fixed release at all (picomatch's
        # ReDoS advisory covered every published version), which would
        # otherwise block every PR. Run `npm audit` locally to see them.
        run: npm audit --omit=dev --audit-level=high
